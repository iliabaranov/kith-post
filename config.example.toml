# Kith Post — non-secret tunables.
# Copy to config.toml to override defaults. Secrets go in .env (never here).
# Precedence: env (KITH_*) > .env > config.toml > built-in defaults.

app_name = "Kith Post"

# Public base URL — used for tracking/RSVP links and the OAuth callback.
# Local:  http://localhost:8000
# Server: https://<machine>.<tailnet>.ts.net
base_url = "http://localhost:8000"

# How mail is sent: "dry-run" (write .eml to data/outbox, no Gmail call),
# "self-only" (send only to the logged-in user), or "live".
send_mode = "dry-run"

# Where the SQLite db + uploaded images + dry-run outbox live.
data_dir = "data"

# Delete heavy full-res card images this many days after the event (or after
# creation for dateless/orphaned cards); the small inline copy is kept. 0 disables.
# asset_retention_days = 30

# --- Automated reminders (G5, §8) ---
# Nudge non-responders on a schedule relative to the event date. On by default for
# events that have a date AND an RSVP block. Per-event overrides live in the app.
# [reminders]
# enabled = true
# target = "no-rsvp"              # "no-rsvp" (stop on RSVP) or "not-clicked" (stop on open)
# offsets = ["halfway", "7d", "3d"]
# send_hour_local = 9             # ~9am sender-local, not the exact offset instant
# min_gap_hours = 24             # merge reminders that would land closer than this
# max_per_recipient = 3
# sweep_seconds = 300            # background sweep interval (0 disables the loop)
