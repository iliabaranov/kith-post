<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>document.documentElement.classList.add("js");</script>
  <title>{% block title %}{{ settings.app_name }}{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='favicon.svg') }}">
  <style>{{ inline_css('fonts.css')|safe }}
{{ inline_css('kith.css')|safe }}</style>
  {% block head %}{% endblock %}
</head>
<body>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <span class="brand-mark" aria-hidden="true">✉️</span>
    <a class="brand-link" href="/">{{ settings.app_name }}</a>
    <span class="footer-legal">
      <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a>
    </span>
  </footer>
</body>
</html>
