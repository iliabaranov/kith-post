[project]
name = "kith"
version = "1.3.0"
description = "Free, self-hosted, privacy-first digital invitations sent from your own Gmail."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "jinja2>=3.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.3",
    "itsdangerous>=2.2",
    "cryptography>=50.0.2",
    "google-auth>=2.59.1",
    "google-auth-oauthlib>=1.5.0",
    "google-api-python-client>=2.201.0",
    "pillow>=12.3.0",
    "python-multipart>=0.0.12",
    "slowapi>=0.1.9",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.16.10",
    "mypy>=2.4.0",
    "httpx2>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kith"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's idioms: Depends()/Form()/File() in argument defaults are intended.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.File"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
