# Kith Post — one image, local and on the home server. Promotion to the server
# is a config change, not a code change: put real values in .env (KITH_BASE_URL,
# KITH_SEND_MODE, KITH_FERNET_KEY, Google creds, tunnel token), then run:
#
#   docker compose --profile public up -d --build
#
# Without .env the app falls back to safe defaults (localhost + dry-run), so a
# bare `docker compose up` is fine for a quick local look.
services:
  kith:
    build: .
    # Bound to localhost only — the tunnel reaches the app over the compose
    # network (kith:8000), so nothing is exposed to the LAN or the internet.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      KITH_DATA_DIR: "/data"
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # SMS transport — deliberately NOT a service here.
  #
  # The recommended SMS provider is the capcom6 SMS Gateway app running on a
  # phone you own, so the transport is a physical handset rather than a
  # container: nothing to add to compose. Point the app at your LAN, note the
  # Local Server URL and credentials, and set KITH_SMS_ENABLED=true,
  # KITH_SMS_PROVIDER=gateway, KITH_SMS_GATEWAY_URL=http://<phone-ip>:8080 plus
  # KITH_SMS_GATEWAY_USER / _PASS in .env. The container reaches the phone over
  # the host network, so the phone has to be on the same LAN as the box.
  #
  # If instead you run the project's self-hosted relay (for a phone that isn't
  # directly reachable), add it here under a profiles: ["sms"] block mirroring
  # the waha service below, set KITH_SMS_GATEWAY_URL to its compose address and
  # KITH_SMS_GATEWAY_PATH=/3rdparty/v1/messages. Keep it off by default and
  # never behind the public tunnel: not being reachable is the gateway's whole
  # security model.
  #
  # Twilio needs nothing here at all — it is an outbound HTTPS call.

  # WhatsApp transport (WAHA) — one session per kith user, reached only over the
  # compose network at http://waha:3000. Off unless you opt in:
  #   docker compose --profile whatsapp up -d
  # and set KITH_WHATSAPP_ENABLED=true + KITH_WAHA_API_KEY in .env.
  #
  # WAHA is an UNOFFICIAL WhatsApp client: it violates WhatsApp's terms and a
  # linked account can be restricted or banned. At personal-invite volume to
  # people who already know you the practical risk is low, but every host is
  # warned in-app before they link.
  waha:
    # Pinned, NOT :latest — same reasoning as cloudflared below. This is the
    # GOWS build (browserless Go engine, ~850MB vs ~1.15GB for the Chromium
    # one). Engine choice is NOT cosmetic: payload shapes differ between
    # engines AND the session store is per-engine
    # (/app/.sessions/<engine>/<name>), so switching engines re-pairs every
    # user. WEBJS is the fallback if GOWS misbehaves; re-test the send path.
    image: devlikeapro/waha:gows-2026.8.1
    profiles: ["whatsapp"]
    environment:
      WAHA_API_KEY: "${KITH_WAHA_API_KEY:-}"
      WHATSAPP_DEFAULT_ENGINE: "GOWS"
      # Dashboard + Swagger off: kith drives WAHA over the API, and every extra
      # listener is another auth surface. Set the credentials anyway — WAHA
      # autogenerates its own and PRINTS THEM IN ITS LOGS whenever they're
      # unset, and it does that even with the UI disabled (an empty value counts
      # as unset). To poke at the dashboard, see docker-compose.dashboard.yml.
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_SWAGGER_ENABLED: "false"
      WAHA_DASHBOARD_USERNAME: "${WAHA_DASHBOARD_USERNAME:-admin}"
      WAHA_DASHBOARD_PASSWORD: "${WAHA_DASHBOARD_PASSWORD:-}"
      WHATSAPP_SWAGGER_USERNAME: "${WAHA_DASHBOARD_USERNAME:-admin}"
      WHATSAPP_SWAGGER_PASSWORD: "${WAHA_DASHBOARD_PASSWORD:-}"
      WAHA_LOG_FORMAT: "JSON"
      WAHA_LOG_LEVEL: "info"
    volumes:
      # WhatsApp pairings live here. A named volume, deliberately NOT under
      # ./data: the off-box backup covers ./data, and these are live WhatsApp
      # credentials in the clear. Losing them costs a re-scan, nothing more.
      - waha-sessions:/app/.sessions
    # No published ports. The app reaches it at waha:3000 over this network.
    restart: unless-stopped
    healthcheck:
      # Every WAHA route, /health included, is behind the API key.
      test: ["CMD-SHELL",
             "curl -fsS -H \"X-Api-Key: $$WAHA_API_KEY\" http://localhost:3000/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Public HTTPS via Cloudflare Tunnel — free auto-TLS, no open router ports,
  # works behind CGNAT. Enable only when you want the app reachable publicly:
  #   docker compose --profile public up -d
  # Requires CLOUDFLARE_TUNNEL_TOKEN in .env (from the Zero Trust dashboard),
  # and a public hostname there routing your domain -> http://kith:8000.
  cloudflared:
    # Pinned, NOT :latest. `docker compose up -d` does not re-pull, so a
    # floating tag silently freezes at whatever was first cached — this host
    # ran 2026.6.1 for two months while the tag moved twice. Pinning makes the
    # running version visible and lets Dependabot open the bump PR.
    # Cloudflare eventually refuses very old connectors, so this is not
    # cosmetic. To upgrade by hand:
    #   docker pull cloudflare/cloudflared:<new>   # edit the tag below
    #   docker compose --profile public up -d
    image: cloudflare/cloudflared:2026.8.2
    profiles: ["public"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:-}"
    depends_on:
      - kith
    restart: unless-stopped

volumes:
  # WAHA session store. Not backed up on purpose (see the mount comment): these
  # are re-pairable WhatsApp credentials, and shipping them off-box would be a
  # worse trade than asking each host to re-scan a QR code.
  waha-sessions:
