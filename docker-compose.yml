# Local + home-server run. Promotion to the server = change env, not code:
# set KITH_BASE_URL to the ts.net host and KITH_SEND_MODE=live.
services:
  kith:
    build: .
    ports:
      - "8000:8000"
    environment:
      KITH_BASE_URL: "http://localhost:8000"
      KITH_SEND_MODE: "dry-run"
      KITH_DATA_DIR: "/data"
    # Secrets (KITH_SECRET_KEY, Google creds from G1) go here once you have a .env:
    # env_file:
    #   - path: .env
    #     required: false
    volumes:
      - ./data:/data
    restart: unless-stopped
